ConversionUploader:
  image:
    name: lambdaimage
    command: ["src.functions.conversions.uploader.handler"]
  memorySize: 512
  timeout: 300
  iamRoleStatementsName: ${self:service}-${self:custom.stage}-ConversionUploader-lambdaRole
  iamRoleStatements:
    - Effect: Allow
      Action:
        - dynamodb:*
      Resource: "*"
    - Effect: Allow
      Action:
        - logs:CreateLogGroup
        - logs:CreateLogStream
        - logs:PutLogEvents
      Resource: "arn:aws:logs:*:*:*"
  events:
    - schedule:
        rate: cron(0 10 L * ? *)  # 7h BRT (10h UTC), ULTIMO DIA de cada mes
        # `L` no dia-do-mes exige `?` no dia-da-semana: o EventBridge nao
        # aceita os dois especificados. Era cron(0 10 L * ? *) (semanal)
        # ate 03/10/2026.
        enabled: true
        input:
          source: "scheduled_conversion_upload"
