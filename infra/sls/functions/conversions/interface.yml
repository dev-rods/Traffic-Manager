ConversionUploader:
  image:
    name: lambdaimage
    command: ["src.functions.conversions.uploader.handler"]
  memorySize: 512
  timeout: 300
  iamRoleStatementsName: ${self:service}-${self:custom.stage}-ConversionUploader-lambdaRole
  iamRoleStatements:
    - Effect: Allow
      Action:
        - dynamodb:*
      Resource: "*"
    - Effect: Allow
      Action:
        - logs:CreateLogGroup
        - logs:CreateLogStream
        - logs:PutLogEvents
      Resource: "arn:aws:logs:*:*:*"
  events:
    - schedule:
        rate: cron(0 10 ? * MON *)  # 7h BRT (10h UTC), toda segunda-feira
        enabled: true
        input:
          source: "scheduled_conversion_upload"
