CreateFaq:
  handler: src.functions.faq.create.handler
  memorySize: 512
  timeout: 30
  events:
    - http:
        path: clinics/{clinicId}/faq
        method: post
        cors: true

ListFaq:
  handler: src.functions.faq.list.handler
  memorySize: 512
  timeout: 30
  events:
    - http:
        path: clinics/{clinicId}/faq
        method: get
        cors: true

UpdateFaq:
  handler: src.functions.faq.update.handler
  memorySize: 512
  timeout: 30
  events:
    - http:
        path: faq/{faqId}
        method: put
        cors: true
