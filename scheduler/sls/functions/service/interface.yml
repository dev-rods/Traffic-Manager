CreateService:
  handler: src.functions.service.create.handler
  memorySize: 512
  timeout: 30
  events:
    - http:
        path: clinics/{clinicId}/services
        method: post
        cors: true

ListServices:
  handler: src.functions.service.list.handler
  memorySize: 512
  timeout: 30
  events:
    - http:
        path: clinics/{clinicId}/services
        method: get
        cors: true

UpdateService:
  handler: src.functions.service.update.handler
  memorySize: 512
  timeout: 30
  events:
    - http:
        path: services/{serviceId}
        method: put
        cors: true
