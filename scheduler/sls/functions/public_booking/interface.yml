PublicBookingSendOtp:
  handler: src.functions.public_booking.send_otp.handler
  memorySize: 512
  timeout: 30
  iamRoleStatementsName: ${self:service}-${self:custom.stage}-PublicBookingSendOtp-lambdaRole
