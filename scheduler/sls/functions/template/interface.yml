CreateTemplate:
  handler: src.functions.template.create.handler
  memorySize: 512
  timeout: 30
  events:
    - http:
        path: clinics/{clinicId}/templates
        method: post
        cors: true

ListTemplates:
  handler: src.functions.template.list.handler
  memorySize: 512
  timeout: 30
  events:
    - http:
        path: clinics/{clinicId}/templates
        method: get
        cors: true

UpdateTemplate:
  handler: src.functions.template.update.handler
  memorySize: 512
  timeout: 30
  events:
    - http:
        path: templates/{templateId}
        method: put
        cors: true
