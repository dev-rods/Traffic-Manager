WhatsAppWebhook:
  handler: src.functions.webhook.handler.handler
  memorySize: 512
  timeout: 120
  iamRoleStatementsName: ${self:service}-${self:custom.stage}-WhatsAppWebhook-lambdaRole
  iamRoleStatements:
    - Effect: Allow
      Action:
        - dynamodb:GetItem
        - dynamodb:PutItem
        - dynamodb:Query
        # UpdateItem e DeleteItem existem para o balde que junta a rajada de
        # mensagens (agregador_de_mensagens): o append é um UpdateItem atômico e
        # a drenagem é um DeleteItem condicionado à versão.
        #
        # Faltavam, e o efeito foi mudo: o agrupamento caía no fallback e o bot
        # respondia mensagem por mensagem, como antes. A suíte passava e o
        # deploy saía com exit 0 - permissão não é coisa que teste unitário vê.
        - dynamodb:UpdateItem
        - dynamodb:DeleteItem
      Resource:
        - "arn:aws:dynamodb:${self:provider.region}:${self:custom.accountId}:table/${self:custom.resourcePrefix}-conversation-sessions"
        - "arn:aws:dynamodb:${self:provider.region}:${self:custom.accountId}:table/${self:custom.resourcePrefix}-message-events"
    # Auto-invocação: o agente roda fora do request do z-api, que reenvia o
    # webhook quando não responde em ~8s. Ver TAREFA_PROCESSAR no handler.
    - Effect: Allow
      Action:
        - lambda:InvokeFunction
      Resource:
        - "arn:aws:lambda:${self:provider.region}:${self:custom.accountId}:function:${self:service}-${self:custom.stage}-WhatsAppWebhook"
    - Effect: Allow
      Action:
        - ssm:GetParameter
      Resource:
        - "arn:aws:ssm:${self:provider.region}:*:parameter/${self:custom.stage}/*"
    - Effect: Allow
      Action:
        - logs:CreateLogGroup
        - logs:CreateLogStream
        - logs:PutLogEvents
      Resource: "arn:aws:logs:*:*:*"
  events:
    - http:
        path: webhook/whatsapp
        method: post
        cors: true

WhatsAppStatusWebhook:
  handler: src.functions.webhook.status_handler.handler
  memorySize: 512
  timeout: 30
  iamRoleStatementsName: ${self:service}-${self:custom.stage}-WhatsAppStatusWebhook-lambdaRole
  iamRoleStatements:
    - Effect: Allow
      Action:
        - dynamodb:PutItem
      Resource:
        - "arn:aws:dynamodb:${self:provider.region}:${self:custom.accountId}:table/${self:custom.resourcePrefix}-message-events"
    - Effect: Allow
      Action:
        - ssm:GetParameter
      Resource:
        - "arn:aws:ssm:${self:provider.region}:*:parameter/${self:custom.stage}/*"
    - Effect: Allow
      Action:
        - logs:CreateLogGroup
        - logs:CreateLogStream
        - logs:PutLogEvents
      Resource: "arn:aws:logs:*:*:*"
  events:
    - http:
        path: webhook/whatsapp/status
        method: post
        cors: true
