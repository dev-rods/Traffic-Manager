# Termo de consentimento no painel (PRD 036). Uma rota coringa para as
# sub-rotas de src/functions/consent/router.py: a stack está perto do limite
# de 500 recursos do CloudFormation. Role própria só pelo GetObject: a URL
# assinada do PDF é gerada pela credencial desta Lambda, e sem a permissão na
# role o link abre com AccessDenied.
Consentimento:
  handler: src.functions.consent.router.handler
  memorySize: 512
  timeout: 30
  iamRoleStatementsName: ${self:service}-${self:custom.stage}-Consentimento-lambdaRole
  iamRoleStatements:
    - Effect: Allow
      Action:
        - s3:GetObject
      Resource:
        - "arn:aws:s3:::${self:custom.resourcePrefix}-documentos/clinics/*"
    # PRD 048: o link de documentos enviado pelo painel sai daqui como envio
    # do sistema e precisa ficar no MessageEvents. Sem este PutItem o
    # MessageTracker engole o AccessDenied, o eco do z-api parece atendente
    # no webhook e o bot é pausado por 24h para a paciente (visto em 26/11).
    - Effect: Allow
      Action:
        - dynamodb:PutItem
      Resource:
        - "arn:aws:dynamodb:${self:provider.region}:${self:custom.accountId}:table/${self:custom.resourcePrefix}-message-events"
    - Effect: Allow
      Action:
        - logs:CreateLogGroup
        - logs:CreateLogStream
        - logs:PutLogEvents
      Resource: "arn:aws:logs:*:*:*"
  events:
    - http:
        path: clinics/{clinicId}/consents/{proxy+}
        method: any
