ListPatients:
  handler: src.functions.patient.list.handler
  memorySize: 512
  timeout: 30
  events:
    - http:
        path: clinics/{clinicId}/patients
        method: get
        cors: true

UpdatePatient:
  handler: src.functions.patient.update.handler
  memorySize: 512
  timeout: 30
  events:
    - http:
        path: clinics/{clinicId}/patients/{patientId}
        method: patch
        cors: true

CreatePatient:
  handler: src.functions.patient.create.handler
  memorySize: 512
  timeout: 30
  events:
    - http:
        path: clinics/{clinicId}/patients
        method: post
        cors: true

DeletePatient:
  handler: src.functions.patient.delete.handler
  memorySize: 512
  timeout: 30
  events:
    - http:
        path: clinics/{clinicId}/patients/{patientId}
        method: delete
        cors: true
