# Prontuario: historico por sessao.
#
# Seis Lambdas. A LaserProtocol devolve a tabela de parametros inteira num
# payload so, para a tela sugerir enquanto a profissional digita sem uma
# consulta por linha.
#
# Nenhuma destas rotas e alcancada pelo bot.

CreateSessionRecord:
  handler: src.functions.patient_record.create.handler
  memorySize: 512
  timeout: 30
  iamRoleStatementsName: ${self:service}-${self:custom.stage}-CreateSessionRecord-lambdaRole
  iamRoleStatements:
    - Effect: Allow
      Action:
        - ssm:GetParameter
      Resource:
        - "arn:aws:ssm:${self:provider.region}:*:parameter/${self:custom.stage}/*"
    - Effect: Allow
      Action:
        - logs:CreateLogGroup
        - logs:CreateLogStream
        - logs:PutLogEvents
      Resource: "arn:aws:logs:*:*:*"
  events:
    - http:
        path: clinics/{clinicId}/patients/{patientId}/session-records
        method: post
        cors: true

