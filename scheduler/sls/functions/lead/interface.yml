CreateLead:
  handler: src.functions.lead.create.handler
  memorySize: 512
  timeout: 30
  iamRoleStatementsName: ${self:service}-${self:custom.stage}-CreateLead-lambdaRole
  iamRoleStatements:
    # Enfileira a abertura de conversa quando o lead é novo e elegível.
    - Effect: Allow
      Action:
        - dynamodb:PutItem
      Resource:
        - "arn:aws:dynamodb:${self:provider.region}:${self:custom.accountId}:table/${self:custom.resourcePrefix}-outbound-queue"
    - Effect: Allow
      Action:
        - logs:CreateLogGroup
        - logs:CreateLogStream
        - logs:PutLogEvents
      Resource: "arn:aws:logs:*:*:*"
  events:
    - http:
        path: leads
        method: post
        # PRD 066: a LP da Essencia (draclaradourado.com.br, Lovable estatico)
        # grava do navegador, de outra origem, com x-api-key: o browser faz
        # preflight. Unica excecao ao PRD 055 (registrada em
        # CHAMADAS_DE_FORA_DA_VERCEL, test_limite_de_recursos.py). Sai quando a
        # LP gravar pelo servidor, como a da Nobre.
        cors: true

ListLeads:
  handler: src.functions.lead.list.handler
  memorySize: 512
  timeout: 30
  iamRoleStatementsName: ${self:service}-${self:custom.stage}-ListLeads-lambdaRole
  iamRoleStatements:
    # BatchGetItem: o status da conversa (bot ou atendente) vem das sessoes, uma
    # leitura em lote por pagina. Sem isto a listagem cai no fallback e o painel
    # volta a mostrar lead sem status - sem erro nenhum aparente.
    - Effect: Allow
      Action:
        - dynamodb:BatchGetItem
        - dynamodb:GetItem
      Resource:
        - "arn:aws:dynamodb:${self:provider.region}:${self:custom.accountId}:table/${self:custom.resourcePrefix}-conversation-sessions"
    - Effect: Allow
      Action:
        - logs:CreateLogGroup
        - logs:CreateLogStream
        - logs:PutLogEvents
      Resource: "arn:aws:logs:*:*:*"
  events:
    - http:
        path: clinics/{clinicId}/leads
        method: get

UpdateLead:
  handler: src.functions.lead.update.handler
  memorySize: 512
  timeout: 30
  events:
    - http:
        path: leads/{leadId}
        method: put

IniciarConversaPeloBot:
  handler: src.functions.lead.iniciar_bot.handler
  memorySize: 512
  timeout: 30
  iamRoleStatementsName: ${self:service}-${self:custom.stage}-IniciarConversaPeloBot-lambdaRole
  iamRoleStatements:
    - Effect: Allow
      Action:
        - dynamodb:PutItem
      Resource:
        - "arn:aws:dynamodb:${self:provider.region}:${self:custom.accountId}:table/${self:custom.resourcePrefix}-outbound-queue"
    # Acorda o dispatcher em vez de esperar o cron de 10 minutos: a atendente
    # clica e olha a tela, e "na fila" parado por dez minutos parece defeito.
    - Effect: Allow
      Action:
        - lambda:InvokeFunction
      Resource:
        - "arn:aws:lambda:${self:provider.region}:${self:custom.accountId}:function:${self:service}-${self:custom.stage}-OutboundProcessor"
    - Effect: Allow
      Action:
        - logs:CreateLogGroup
        - logs:CreateLogStream
        - logs:PutLogEvents
      Resource: "arn:aws:logs:*:*:*"
  events:
    - http:
        path: leads/{leadId}/iniciar-pelo-bot
        method: post

MarcarContatoIniciado:
  handler: src.functions.lead.marcar_contatado.handler
  memorySize: 512
  timeout: 30
  events:
    - http:
        path: leads/{leadId}/marcar-contatado
        method: post

# PRD 057: correcao manual do estagio pela recepcao. Sem chamada a AWS alem
# do banco: role compartilhada.
AtualizaEstagioDoLead:
  handler: src.functions.lead.atualiza_estagio.handler
  memorySize: 512
  timeout: 30
  events:
    - http:
        path: clinics/{clinicId}/leads/{leadId}/stage
        method: patch

# PRD 057: recalcula o estagio de todos os leads. 7h BRT (10h UTC), uma hora
# depois do SyncWhatsAppChats, para o espelho do z-api estar do dia. Diario
# porque a fila e semanal; mais que isso so gastaria chamadas de modelo sem
# ninguem olhar. `{"dryRun": true}` calcula e devolve sem escrever.
ClassificaLeads:
  handler: src.functions.lead.classifica_estagios.handler
  memorySize: 1024
  timeout: 600
  environment:
    CRM_MAX_CHAMADAS_MODELO: "200"
  iamRoleStatementsName: ${self:service}-${self:custom.stage}-ClassificaLeads-lambdaRole
  iamRoleStatements:
    # Transcricao de cada lead: uma Query por variante do telefone.
    - Effect: Allow
      Action:
        - dynamodb:Query
      Resource:
        - "arn:aws:dynamodb:${self:provider.region}:${self:custom.accountId}:table/${self:custom.resourcePrefix}-message-events"
    # Sessoes da clinica em lote (PRD 058): a entrega do bot vive no bloco atendimento.
    - Effect: Allow
      Action:
        - dynamodb:BatchGetItem
      Resource:
        - "arn:aws:dynamodb:${self:provider.region}:${self:custom.accountId}:table/${self:custom.resourcePrefix}-conversation-sessions"
    - Effect: Allow
      Action:
        - logs:CreateLogGroup
        - logs:CreateLogStream
        - logs:PutLogEvents
      Resource: "arn:aws:logs:*:*:*"
  events:
    - schedule:
        rate: cron(0 10 * * ? *)
        enabled: true
