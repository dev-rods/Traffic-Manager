CreateDiscountRules:
  handler: src.functions.discount_rules.create.handler
  memorySize: 512
  timeout: 30
  events:
    - http:
        path: clinics/{clinicId}/discount-rules
        method: post
        cors: true

GetDiscountRules:
  handler: src.functions.discount_rules.get.handler
  memorySize: 512
  timeout: 30
  events:
    - http:
        path: clinics/{clinicId}/discount-rules
        method: get
        cors: true

UpdateDiscountRules:
  handler: src.functions.discount_rules.update.handler
  memorySize: 512
  timeout: 30
  events:
    - http:
        path: clinics/{clinicId}/discount-rules
        method: put
        cors: true
