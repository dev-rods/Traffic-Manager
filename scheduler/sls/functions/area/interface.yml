CreateArea:
  handler: src.functions.area.create.handler
  memorySize: 512
  timeout: 30
  events:
    - http:
        path: clinics/{clinicId}/areas
        method: post

ListAreas:
  handler: src.functions.area.list.handler
  memorySize: 512
  timeout: 30
  events:
    - http:
        path: clinics/{clinicId}/areas
        method: get

GetArea:
  handler: src.functions.area.get.handler
  memorySize: 512
  timeout: 30
  events:
    - http:
        path: areas/{areaId}
        method: get

UpdateArea:
  handler: src.functions.area.update.handler
  memorySize: 512
  timeout: 30
  events:
    - http:
        path: areas/{areaId}
        method: put

DeleteArea:
  handler: src.functions.area.delete.handler
  memorySize: 512
  timeout: 30
  events:
    - http:
        path: areas/{areaId}
        method: delete
