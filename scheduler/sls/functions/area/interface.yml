CreateArea:
  handler: src.functions.area.create.handler
  memorySize: 512
  timeout: 30
  events:
    - http:
        path: clinics/{clinicId}/areas
        method: post
        cors: true

ListAreas:
  handler: src.functions.area.list.handler
  memorySize: 512
  timeout: 30
  events:
    - http:
        path: clinics/{clinicId}/areas
        method: get
        cors: true

GetArea:
  handler: src.functions.area.get.handler
  memorySize: 512
  timeout: 30
  events:
    - http:
        path: areas/{areaId}
        method: get
        cors: true

UpdateArea:
  handler: src.functions.area.update.handler
  memorySize: 512
  timeout: 30
  events:
    - http:
        path: areas/{areaId}
        method: put
        cors: true

DeleteArea:
  handler: src.functions.area.delete.handler
  memorySize: 512
  timeout: 30
  events:
    - http:
        path: areas/{areaId}
        method: delete
        cors: true
