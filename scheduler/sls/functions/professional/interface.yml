CreateProfessional:
  handler: src.functions.professional.create.handler
  memorySize: 512
  timeout: 30
  events:
    - http:
        path: clinics/{clinicId}/professionals
        method: post
        cors: true

ListProfessionals:
  handler: src.functions.professional.list.handler
  memorySize: 512
  timeout: 30
  events:
    - http:
        path: clinics/{clinicId}/professionals
        method: get
        cors: true
