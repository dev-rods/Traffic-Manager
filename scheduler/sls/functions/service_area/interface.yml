CreateServiceArea:
  handler: src.functions.service_area.create.handler
  memorySize: 512
  timeout: 30
  events:
    - http:
        path: services/{serviceId}/areas
        method: post

ListServiceAreas:
  handler: src.functions.service_area.list.handler
  memorySize: 512
  timeout: 30
  events:
    - http:
        path: services/{serviceId}/areas
        method: get

UpdateServiceArea:
  handler: src.functions.service_area.update.handler
  memorySize: 512
  timeout: 30
  events:
    - http:
        path: services/{serviceId}/areas/{areaId}
        method: put

DeleteServiceArea:
  handler: src.functions.service_area.delete.handler
  memorySize: 512
  timeout: 30
  events:
    - http:
        path: services/{serviceId}/areas/{areaId}
        method: delete
